<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAM Permissions Visualizer</title>
  <!-- D3 v7 — powers the force-directed graph, zoom/drag, and SVG selections.
       MUST load before InterfaceModel.js or the analyzer crashes with `d3 is not defined`. -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- defer = wait until the DOM is fully parsed before running -->
  <script src="InterfaceModel.js" defer></script>
  <link rel="stylesheet" href="StyleSheet.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔐</div>
    <div>
      <div class="logo-text">IAM GRAPH <span class="tag new">Beta</span></div>
      <div class="logo-sub">Identity & Access Permissions Visualizer</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat"><span class="stat-val" id="stat-nodes">0</span><span class="stat-label">Nodes</span></div>
    <div class="stat"><span class="stat-val" id="stat-edges">0</span><span class="stat-label">Edges</span></div>
    <div class="stat"><span class="stat-val warn" id="stat-warnings">0</span><span class="stat-label">Warnings</span></div>
    <div class="stat"><span class="stat-val critical" id="stat-critical">0</span><span class="stat-label">Critical</span></div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <!-- INPUT PANEL -->
    <div class="panel">
      <div class="panel-header">Policy Input</div>
      <div class="panel-content">
        <textarea id="policy-input" placeholder='Paste AWS IAM Policy JSON here...'></textarea>
        <div class="examples">
          <button class="btn" onclick="loadPolicy()">▶ Load: IAM User Policy</button>
        </div>
        <button class="btn" onclick="analyzePolicy()" style="margin-top:10px; border-color: var(--accent3); color: var(--accent3); background: rgba(57,255,133,0.08);">
          ⚡ ANALYZE &amp; VISUALIZE
        </button>
      </div>
    </div>

    <!-- FILTER -->
    <div class="panel">
      <div class="panel-header">Filter View</div>
      <div class="panel-content" style="padding: 8px 12px;">
        <select id="filter-type" onchange="applyFilter()">
          <option value="All Nodes">All Nodes</option>
          <option value="Identities">Identities Only</option>
          <option value="Policies">Policies Only</option>
          <option value="Resource">Resource Only</option>
          <option value="Critical">Critical Paths Only</option>
        </select>
      </div>
    </div>

    <!-- FINDINGS -->
    <div class="panel-header" style="border-bottom: 1px solid var(--border);">Security Findings</div>
    <div class="findings" id="findings-list">
      <div class="no-findings" style="margin-top: 24px;">
        <div style="font-size: 24px; margin-bottom: 8px; opacity:0.3;">🛡</div>
        No policy loaded yet
      </div>
    </div>
  </div>

  <!-- GRAPH -->
  <div class="graph-area" id="graph-container">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">◈</div>
      <div class="empty-title">IDENTITY GRAPH</div>
      <div class="empty-sub">Load a policy to visualize permissions</div>
    </div>
    <svg id="graph-svg"></svg>

    <div class="graph-overlay">
      <div class="legend">
        <div class="legend-title">Node Types</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(30,32,60,0.9); border: 1px solid rgba(167,139,250,0.4);"></div> Principal</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(30,41,95,0.9); border: 1px solid rgba(96,165,250,0.8);"></div> IAM Role</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(54,25,92,0.9); border: 1px solid rgba(167,139,250,0.75);"></div> Policy</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(15,76,56,0.9); border: 1px solid rgba(52,211,153,0.75);"></div> Resource</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(133,77,14,0.8); border: 1px solid #fbbf24;"></div> Warning ◆</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(127,29,29,0.85); border: 1px solid #f87171;"></div> Critical ⚠</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(51,65,85,0.85); border: 1px dashed rgba(148,163,184,0.7);"></div> Deny</div>
      </div>
      <div class="controls">
        <!-- Inline SVG icons. fill="none" + stroke="currentColor" means the .ctrl-btn:hover
             color rule paints the icon automatically — no extra CSS needed. -->
        <button class="ctrl-btn" onclick="zoomIn()" title="Zoom In" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="ctrl-btn" onclick="zoomOut()" title="Zoom Out" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="ctrl-btn" onclick="resetZoom()" title="Reset" aria-label="Reset zoom">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.85.94 6.62 2.5L21 8"/>
            <polyline points="21 3 21 8 16 8"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="tooltip"></div>
</body>
</html>
